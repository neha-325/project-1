<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">


    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="w-full">
        <div
            class="max-w-7xl sm:w-3xl md:w-5xl lg:w-7xl bg-[#FCF4EC]  px-2 lg:px-4 shadow-sm mx-auto flex justify-between items-center px:4 ">
            <!-- logo-section -->
            <div class="flex gap-2">
                <img src="/images/icon.png" class="w-[50px] h-[50px] lg:w-[65px] lg:h-[65px] object-contain"
                    alt="Jharokha Icon">

                <img src="/images/logo-11.png" class="w-[100px] h-[50px] lg:w-[125px] lg:h-[65px] object-contain"
                    alt="Jharokha Trends">
            </div>
            <!-- navigation -->
            <nav class="max-w-2xl hidden md:block  text-lg font-semibold text-[#641E28]">
                <ul class="flex font-[Poppins] gap-5">
                    <li>
                        <a href="#" class="hover:text-[#B08D57] hover:border-b-3 transition border-[#B08D57]">Home
                    
                        </a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-[#B08D57] hover:border-b-3 transition border-[#B08D57] ">About</a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-[#B08D57] hover:border-b-3 transition border-[#B08D57] ">Collections</a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-[#B08D57] hover:border-b-3 transition border-[#B08D57]">Gallery</a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-[#B08D57] hover:border-b-3 transition border-[#B08D57]">Blog</a>
                    </li>
                    <li>
                        <a href="#" class="hover:text-[#B08D57] hover:border-b-3 transition border-[#B08D57] ">Contact</a>
                    </li>

                </ul>
            </nav>
            <div class="max-w-3xs  flex items-center text-xl gap-5  text-[#641E28]">
                <button aria-label="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button aria-label="Shopping bag">
                    <i class="fa-solid fa-bag-shopping"></i>
                </button>
            </div>
        </div>
    </header>
    <!-- hero page -->
    <main class="w-full">
        <div
            class="max-w-7xl sm:w-3xl md:w-5xl mx-auto items-center lg:w-7xl grid grid-cols-1 lg:grid-cols-2  my-5 gap-10 mx-auto bg-[#641E28]">
            <!-- writing section  -->
            <div class="max-w-full  mx-auto items-center text-center lg:text-left ">

                <p class="text-[#b18a45] tracking-[5px] uppercase font-sm md:font-xl mb-8">
                    The Royal Ethnic Collection
                </p>

                <h2 class="text-5xl md:text-6xl lg:text-7xl
            font-serif  text-[#FCF4EC]  leading-tight tracking-wide">Elegance That
                    <span class="italic text-[#b18a45]">Tells</span>
                    Your Story
                </h2>

                <p class="text-[#b18a45] mt-6 max-w-md mx-auto lg:mx-2">

                    Discover timeless Indian ethnic fashion
                    where traditional craftsmanship meets
                    modern elegance.

                </p>

                <div class="mt-8 lg:m-2 flex justify-center
            lg:justify-start gap-4">

                    <button class="bg-[#FCF4EC] text-[#741c2c] font-semibold
              px-7 py-3 rounded-full hover:bg-[#571421] hover:text-[#b18a45]">
                        Explore Collection
                    </button>

                    <button class="font-semibold bg-[#FCF4EC] hover:bg-[#571421] hover:text-[#b18a45]
              text-[#741c2c] px-7 py-3 rounded-full">
                        Our Story
                    </button>

                </div>

            </div>
            <!-- image-section  -->
           <img 
  src="/images/hero-5.png"
  alt="Jharokha Trends Royal Collection"
  class="w-full h-full object-cover object-center"
/>
        </div>
    </main>


</body>

</html>
